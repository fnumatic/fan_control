name: build

on:
  push:
    branches: [main, 'dev/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The module uses kernel 7.0 APIs; build against the Ubuntu 26.04 kernel headers.
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential linux-headers-generic kmod

      - uses: actions/checkout@v7

      - name: Build the module (warnings are errors)
        run: |
          KDIR=$(ls -d /usr/src/linux-headers-*-generic | sort -V | tail -n 1)
          make -C module KDIR="$KDIR" W=1 KCFLAGS=-Werror
          /sbin/modinfo module/minisforum_ec.ko | grep -E '^(version|alias|license):'
