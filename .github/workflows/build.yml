name: build

on:
  push:
    branches: [main, 'dev/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The module uses kernel 7.0 APIs; build against the Ubuntu 26.04 kernel headers.
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential linux-headers-generic kmod

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the module (warnings are errors)
        run: |
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          make -C module KDIR="$KDIR" W=1 KCFLAGS=-Werror
          /sbin/modinfo module/minisforum_ec.ko | grep -E '^(version|alias|license):'

      - name: Logic tests
        run: make test
