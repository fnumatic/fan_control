name: release

# Runs when a dev/v* release pull request is merged into main (gh release-flow
# merge watches this run); other merged PRs, such as Dependabot's, skip it.
# Once every other check on the pull request has passed or been skipped, it
# builds the DKMS package and the source tarball in the Ubuntu 26.04 container,
# then publishes them with SHA256SUMS on the merge commit, with the pull
# request's body (the changelog gh release-flow open-pr wrote) as the notes.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  checks: read
  contents: write
  pull-requests: read

jobs:
  checks:
    name: Require passing checks
    # Only merged release PRs from this repository: forks cannot publish.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dev/v')
    # A job of its own because the release job's ubuntu:26.04 container has no gh or jq.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require passing checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # This workflow is itself one of the PR's checks, so leave it out.
          checks=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json bucket,workflow)
          jq -e --arg self "$GITHUB_WORKFLOW" '[.[] | select(.workflow != $self)] |
            length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<< "$checks"

  build:
    needs: checks
    # Only merged release PRs from this repository: forks cannot publish.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dev/v')
    # Releases build and publish one at a time; a job skipped by its if: never joins the group.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.package.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The module uses kernel 7.0 APIs; build against the Ubuntu 26.04 kernel headers.
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential linux-headers-generic dpkg-dev kmod \
            git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Validate tag
        # A container job runs steps with sh unless told otherwise, and [[ =~ ]] needs bash.
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          [[ "$RELEASE_BRANCH" =~ ^dev/v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          printf 'RELEASE_TAG=%s\n' "${RELEASE_BRANCH#dev/}" >> "$GITHUB_ENV"
          # The checkout belongs to another user inside the container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git ls-remote --exit-code --tags origin "${RELEASE_BRANCH#dev/}" >/dev/null; then
            echo "tag ${RELEASE_BRANCH#dev/} already exists; start a new release branch"
            exit 1
          fi

      # Before the build: Kbuild takes MODULE_VERSION from dkms.conf.
      - name: Pin the version
        run: |
          # dkms.conf says "dev" in the repository; the release takes its version from the branch.
          sed -i "s/^PACKAGE_VERSION=.*/PACKAGE_VERSION=\"${RELEASE_TAG#v}\"/" module/dkms.conf
          grep -Fx "PACKAGE_VERSION=\"${RELEASE_TAG#v}\"" module/dkms.conf

      - name: Build the module (warnings are errors)
        run: |
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          make -C module KDIR="$KDIR" W=1 KCFLAGS=-Werror
          /sbin/modinfo module/minisforum_ec.ko | grep -E '^(version|alias|license):'

      - name: Package the release
        id: package
        run: |
          V=${RELEASE_TAG#v}
          echo "version=$V" >> "$GITHUB_OUTPUT"
          N=minisforum-ec-$V
          mkdir -p dist pkg/DEBIAN "pkg/usr/src/$N"
          # Tracked files only: the build step left objects and *.mod.c in module/
          git ls-files -z module | xargs -0 cp -t "pkg/usr/src/$N/"

          tar -C pkg/usr/src -czf "dist/$N.tar.gz" "$N"

          cat > pkg/DEBIAN/control <<EOF
          Package: minisforum-ec-dkms
          Version: $V
          Architecture: all
          Section: kernel
          Priority: optional
          Depends: dkms
          Maintainer: $GITHUB_REPOSITORY_OWNER <$GITHUB_REPOSITORY_OWNER@users.noreply.github.com>
          Homepage: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          Description: Minisforum UM760 Slim (F7BSI) and UM790 Pro (F7BSC) fan control kernel module (DKMS)
           Controls both fans of the Minisforum UM760 Slim and UM790 Pro through their embedded
           controller, with temperature curves and hwmon/lm-sensors support.
          EOF

          printf '#!/bin/sh\nset -e\ndkms install minisforum-ec/%s\nmodprobe minisforum_ec || true\n' "$V" > pkg/DEBIAN/postinst
          printf '#!/bin/sh\nset -e\nmodprobe -r minisforum_ec || true\ndkms remove minisforum-ec/%s --all || true\n' "$V" > pkg/DEBIAN/prerm
          chmod -R u=rwX,go=rX pkg
          chmod 755 pkg/DEBIAN/postinst pkg/DEBIAN/prerm

          dpkg-deb --build --root-owner-group pkg "dist/minisforum-ec-dkms_${V}_all.deb"
          # Fixed name, for releases/latest/download/minisforum-ec-dkms.deb
          cp "dist/minisforum-ec-dkms_${V}_all.deb" dist/minisforum-ec-dkms.deb

          # Lets a download be checked with: sha256sum -c --ignore-missing SHA256SUMS
          (cd dist && sha256sum -- *.deb *.tar.gz > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # Releases publish one at a time.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.build.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          release_args=()
          [[ "$VERSION" == *-* ]] && release_args+=(--prerelease)
          # The release PR body holds the grouped changelog written by gh release-flow open-pr.
          if [[ -n $PR_BODY ]]; then release_args+=(--notes "$PR_BODY"); else release_args+=(--generate-notes); fi
          # Creates the tag on the merge commit and the release, titled with the tag.
          gh release create "$VERSION" dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$VERSION" --target "$MERGE_SHA" "${release_args[@]}"
