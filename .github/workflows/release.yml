name: release

# Runs when a release pull request is merged into main (gh release-flow merge
# watches this run). Tags the merge commit with the version from dkms.conf and
# publishes the DKMS package, the source tarball and the CHANGELOG section.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # The module uses kernel 7.0 APIs; build against the Ubuntu 26.04 kernel headers.
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential linux-headers-generic dpkg-dev kmod \
            git ca-certificates

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Build the module (warnings are errors)
        run: |
          KDIR=$(ls -d /usr/src/linux-headers-*-generic | sort -V | tail -n 1)
          make -C module KDIR="$KDIR" W=1 KCFLAGS=-Werror
          /sbin/modinfo module/minisforum_ec.ko | grep -E '^(version|alias|license):'

      - name: Package the release
        run: |
          V=$(sed -n 's/^PACKAGE_VERSION="\(.*\)"/\1/p' module/dkms.conf)
          echo "V=$V" >> "$GITHUB_ENV"
          # The checkout belongs to another user inside the container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git ls-remote --exit-code --tags origin "v$V" >/dev/null; then
            echo "tag v$V already exists; bump PACKAGE_VERSION in module/dkms.conf"
            exit 1
          fi
          N=minisforum-ec-$V
          mkdir -p dist pkg/DEBIAN "pkg/usr/src/$N"
          # Tracked files only: the build step left objects and *.mod.c in module/
          git ls-files -z module | xargs -0 cp -t "pkg/usr/src/$N/"

          tar -C pkg/usr/src -czf "dist/$N.tar.gz" "$N"

          cat > pkg/DEBIAN/control <<EOF
          Package: minisforum-ec-dkms
          Version: $V
          Architecture: all
          Section: kernel
          Priority: optional
          Depends: dkms
          Maintainer: $GITHUB_REPOSITORY_OWNER <$GITHUB_REPOSITORY_OWNER@users.noreply.github.com>
          Homepage: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          Description: Minisforum UM760 Slim (F7BSI) and UM790 Pro (F7BSC) fan control kernel module (DKMS)
           Controls both fans of the Minisforum UM760 Slim and UM790 Pro through their embedded
           controller, with temperature curves and hwmon/lm-sensors support.
          EOF

          printf '#!/bin/sh\nset -e\ndkms install minisforum-ec/%s\nmodprobe minisforum_ec || true\n' "$V" > pkg/DEBIAN/postinst
          printf '#!/bin/sh\nset -e\nmodprobe -r minisforum_ec || true\ndkms remove minisforum-ec/%s --all || true\n' "$V" > pkg/DEBIAN/prerm
          chmod -R u=rwX,go=rX pkg
          chmod 755 pkg/DEBIAN/postinst pkg/DEBIAN/prerm

          dpkg-deb --build --root-owner-group pkg "dist/minisforum-ec-dkms_${V}_all.deb"
          # Fixed name, for releases/latest/download/minisforum-ec-dkms.deb
          cp "dist/minisforum-ec-dkms_${V}_all.deb" dist/minisforum-ec-dkms.deb

          # Release notes: this version's section of CHANGELOG.md
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
          ls -l dist

      - name: Tag the merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "minisforum-ec $V"
          git push origin "v$V"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.V }}
          body_path: dist/notes.md
          files: |
            dist/*.deb
            dist/*.tar.gz
